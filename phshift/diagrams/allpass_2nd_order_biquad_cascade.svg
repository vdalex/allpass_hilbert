<svg width="100%" viewBox="0 0 680 155" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Second-order all-pass (biquad) as two cascaded first-order sections</title>
<desc>Two first-order all-pass sections with poles c1 and c2 in series realise one second-order all-pass biquad.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--p)}.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:500;fill:var(--p)}
.arr{stroke:var(--s);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cblue rect{fill:var(--bluebg);stroke:var(--blue);stroke-width:.8}
:root{--p:#1f2328;--s:#57606a;--blue:#2f6fb3;--bluebg:#eaf2fb}
@media (prefers-color-scheme:dark){:root{--p:#e6edf3;--s:#9aa4ae;--blue:#6cb0ee;--bluebg:#16283a}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--s)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="44" y="94" text-anchor="start">x[n]</text>
<line class="arr" x1="80" y1="90" x2="150" y2="90" marker-end="url(#arrow)"/>
<g class="cblue"><rect x="152" y="66" width="150" height="48" rx="6"/><text class="th" x="227" y="86" text-anchor="middle">All-pass A₁(z)</text><text class="ts" x="227" y="103" text-anchor="middle">pole c₁</text></g>
<line class="arr" x1="302" y1="90" x2="372" y2="90" marker-end="url(#arrow)"/>
<g class="cblue"><rect x="374" y="66" width="150" height="48" rx="6"/><text class="th" x="449" y="86" text-anchor="middle">All-pass A₂(z)</text><text class="ts" x="449" y="103" text-anchor="middle">pole c₂</text></g>
<line class="arr" x1="524" y1="90" x2="596" y2="90" marker-end="url(#arrow)"/>
<text class="t" x="600" y="94" text-anchor="start">y[n]</text>
</svg>
