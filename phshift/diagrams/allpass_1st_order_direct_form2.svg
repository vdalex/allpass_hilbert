<svg width="100%" viewBox="0 0 680 190" role="img" xmlns="http://www.w3.org/2000/svg">
<title>First-order all-pass, Direct Form II</title>
<desc>Canonical one-delay all-pass section: feed-forward multiplier minus c on the current state, unit path on the delayed state, and feedback multiplier plus c.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--p)}.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:500;fill:var(--p)}
.box{fill:var(--bg2);stroke:var(--b);stroke-width:.8}
.arr{stroke:var(--s);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
:root{--p:#1f2328;--s:#57606a;--bg2:#ffffff;--b:#8c959f}
@media (prefers-color-scheme:dark){:root{--p:#e6edf3;--s:#9aa4ae;--bg2:#0d1117;--b:#6e7681}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--s)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="44" y="94" text-anchor="start">x[n]</text>
<line class="arr" x1="76" y1="90" x2="126" y2="90" marker-end="url(#arrow)"/>
<circle class="box" cx="140" cy="90" r="13"/><text class="th" x="140" y="95" text-anchor="middle">+</text>
<line class="arr" x1="153" y1="90" x2="298" y2="90" marker-end="url(#arrow)"/>
<circle cx="250" cy="90" r="3" fill="var(--p)"/>
<path class="arr" d="M250 90 L250 48 L296 48" marker-end="url(#arrow)"/>
<polygon class="box" points="300,36 300,60 330,48"/>
<text class="ts" x="315" y="30" text-anchor="middle">−c</text>
<path class="arr" d="M330 48 L540 48 L540 77" marker-end="url(#arrow)"/>
<rect class="box" x="300" y="75" width="50" height="30" rx="4"/><text class="th" x="325" y="94" text-anchor="middle">z⁻¹</text>
<circle cx="380" cy="90" r="3" fill="var(--p)"/>
<line class="arr" x1="350" y1="90" x2="527" y2="90" marker-end="url(#arrow)"/>
<path class="arr" d="M380 90 L380 158 L303 158" marker-end="url(#arrow)"/>
<polygon class="box" points="300,146 300,170 270,158"/>
<text class="ts" x="286" y="140" text-anchor="middle">c</text>
<path class="arr" d="M270 158 L140 158 L140 103" marker-end="url(#arrow)"/>
<circle class="box" cx="540" cy="90" r="13"/><text class="th" x="540" y="95" text-anchor="middle">+</text>
<line class="arr" x1="553" y1="90" x2="600" y2="90" marker-end="url(#arrow)"/>
<text class="t" x="604" y="94" text-anchor="start">y[n]</text>
</svg>
