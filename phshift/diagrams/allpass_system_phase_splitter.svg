<svg width="100%" viewBox="0 0 680 210" role="img" xmlns="http://www.w3.org/2000/svg">
<title>All-pass Hilbert phase-splitter system</title>
<desc>The input splits into two all-pass legs whose outputs I and Q differ in phase by about 90 degrees across the band.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--p)}.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:500;fill:var(--p)}
.box{fill:var(--bg2);stroke:var(--b);stroke-width:.8}
.arr{stroke:var(--s);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cblue rect{fill:var(--bluebg);stroke:var(--blue);stroke-width:.8}.cteal rect{fill:var(--tealbg);stroke:var(--teal);stroke-width:.8}
:root{--p:#1f2328;--s:#57606a;--bg2:#ffffff;--b:#8c959f;--blue:#2f6fb3;--bluebg:#eaf2fb;--teal:#1a8f7f;--tealbg:#e6f5f2}
@media (prefers-color-scheme:dark){:root{--p:#e6edf3;--s:#9aa4ae;--bg2:#0d1117;--b:#6e7681;--blue:#6cb0ee;--bluebg:#16283a;--teal:#4fc7b6;--tealbg:#0f2a27}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--s)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="44" y="128" text-anchor="start">x[n]</text>
<line class="arr" x1="78" y1="124" x2="150" y2="124"/>
<circle cx="150" cy="124" r="3" fill="var(--p)"/>
<path class="arr" d="M150 124 L150 90 L226 90" marker-end="url(#arrow)"/>
<path class="arr" d="M150 124 L150 158 L226 158" marker-end="url(#arrow)"/>
<g class="cblue"><rect x="230" y="66" width="252" height="48" rx="6"/><text class="th" x="356" y="86" text-anchor="middle">All-pass leg 1</text><text class="ts" x="356" y="103" text-anchor="middle">N first-order sections</text></g>
<g class="cteal"><rect x="230" y="134" width="252" height="48" rx="6"/><text class="th" x="356" y="154" text-anchor="middle">All-pass leg 2</text><text class="ts" x="356" y="171" text-anchor="middle">N first-order sections</text></g>
<line class="arr" x1="482" y1="90" x2="560" y2="90" marker-end="url(#arrow)"/>
<line class="arr" x1="482" y1="158" x2="560" y2="158" marker-end="url(#arrow)"/>
<text class="th" x="566" y="94" text-anchor="start">I</text>
<text class="th" x="566" y="162" text-anchor="start">Q</text>
</svg>
